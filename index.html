<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neuryo Headset Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Design picker. Same light look as the design pages. Designs come from designs/designs.json:
   to add one, put its page in designs/<id>/index.html and add an entry to that file. */
:root {
  color-scheme: light;
  --bg: #ffffff; --bg-2: #eef0f2; --fg: #111417; --muted: #6b737b; --line: #e3e6e9; --ink: #111417;
  --f: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --bar: 52px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f); -webkit-font-smoothing: antialiased; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

/* picker */
#picker { min-height: 100%; display: flex; align-items: center; justify-content: center;
  padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(90% 80% at 50% 30%, var(--bg) 0%, var(--bg) 45%, var(--bg-2) 100%); }
.wrap { width: 100%; max-width: 560px; }
.wrap h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.wrap .sub { margin: 6px 0 22px; font-size: 14px; color: var(--muted); line-height: 1.45; }
#list { display: flex; flex-direction: column; gap: 10px; }
.card { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 16px 18px;
  box-shadow: 0 1px 2px rgba(17,20,23,.04); transition: border-color .15s, box-shadow .15s; }
.card:hover { border-color: var(--fg); box-shadow: 0 6px 24px rgba(17,20,23,.08); }
.card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.card b { font-size: 16px; font-weight: 600; }
.card .meta { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card p { margin: 8px 0 0; font-size: 13.5px; line-height: 1.5; color: #3d454c; }
.card .status { display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--bg-2); color: var(--muted); }
.card .status.now { background: var(--ink); color: #fff; }
.err { font-size: 13.5px; color: var(--muted); }

/* viewer */
#viewer { position: fixed; inset: 0; display: flex; flex-direction: column; }
.vbar { height: calc(var(--bar) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
.vbar .home { border: 0; background: transparent; padding: 6px 4px; font-weight: 600; font-size: 15px; white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); min-width: 0; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--ink); color: #fff; }
.spacer { flex: 1; }
.vbar .ext { font-size: 12.5px; color: var(--muted); text-decoration: none; white-space: nowrap; padding: 6px 4px; }
.vbar .ext:hover { color: var(--fg); }
#frame { flex: 1; width: 100%; border: 0; display: block; background: var(--bg); }
@media (max-width: 560px) { .vbar .ext { display: none; } .vbar .home span { display: none; } }
</style>

<main id="picker">
  <div class="wrap">
    <h1>Neuryo headset designs</h1>
    <p class="sub">Each design is a separate 3D model. Pick one to open it; you can switch between them at the top.</p>
    <div id="list" aria-live="polite"><p class="err">Loading designs…</p></div>
  </div>
</main>

<section id="viewer" hidden>
  <header class="vbar">
    <button class="home" id="home" aria-label="All designs">← <span>All designs</span></button>
    <div class="seg" id="seg" role="group" aria-label="Design"></div>
    <span class="spacer"></span>
    <a class="ext" id="doc" target="_blank" rel="noopener">Design notes ↗</a>
    <a class="ext" id="ext" target="_blank" rel="noopener">Open on its own ↗</a>
  </header>
  <iframe id="frame" title="Neuryo headset 3D model" allow="xr-spatial-tracking; camera; fullscreen; accelerometer; gyroscope"></iframe>
</section>

<script>
const picker = document.getElementById('picker'), viewer = document.getElementById('viewer');
const list = document.getElementById('list'), seg = document.getElementById('seg'), frame = document.getElementById('frame'), ext = document.getElementById('ext'), doc = document.getElementById('doc');
const REPO = 'https://github.com/aryankalra404/Neuryo-Headset/blob/main/';
let designs = [], current = null;
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderList() {
  list.innerHTML = '';
  designs.forEach((d, i) => {
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<div class="row"><b>${esc(d.name)}</b><span class="meta">${esc(d.channels)}</span></div>
      <p>${esc(d.summary)}</p><span class="status${i === designs.length - 1 ? ' now' : ''}">${esc(d.status)}</span>`;
    b.addEventListener('click', () => open(d.id));
    list.appendChild(b);
  });
  seg.innerHTML = '';
  for (const d of designs) {
    const b = document.createElement('button'); b.textContent = d.id; b.title = d.name; b.dataset.id = d.id;
    b.addEventListener('click', () => open(d.id)); seg.appendChild(b);
  }
}
// Hash: #v3 opens a design; #v3/part=fz&view=side… also passes the design page's own view state (its "Copy link" makes these).
function open(id, push = true, st = '') {
  const d = designs.find(x => x.id === id); if (!d) return showPicker(push);
  if (current !== id || st) frame.src = d.path + (st ? '#' + st : '');
  current = id; document.title = 'Neuryo · ' + d.name;
  ext.href = d.path;
  doc.hidden = !d.docs; if (d.docs) doc.href = REPO + d.docs;
  seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id));
  picker.hidden = true; viewer.hidden = false;
  if (push && location.hash.slice(1).split('/')[0] !== id) history.pushState(null, '', '#' + id);
  frame.focus();
}
function showPicker(push = true) {
  viewer.hidden = true; picker.hidden = false; document.title = 'Neuryo Headset Designs';
  if (push && location.hash) history.pushState(null, '', location.pathname + location.search);
}
document.getElementById('home').addEventListener('click', () => showPicker());
const parseHash = () => { const h = location.hash.slice(1), i = h.indexOf('/'); return i < 0 ? [h, ''] : [h.slice(0, i), h.slice(i + 1)]; };
window.addEventListener('popstate', () => { const [id, st] = parseHash(); id ? open(id, false, st) : showPicker(false); });

fetch('designs/designs.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  designs = Array.isArray(data) ? data : [];
  renderList();
  const [id, st] = parseHash(); if (id) open(id, false, st);
}).catch(() => {
  list.innerHTML = '<p class="err">Could not load the design list. Open the designs directly: <a href="designs/v1/">v1</a> · <a href="designs/v2/">v2</a> · <a href="designs/v3/">v3</a>.</p>';
});
</script>
