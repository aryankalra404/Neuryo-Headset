; Neuryo rev B: Seeed XIAO ESP32-S3 (8 MB flash, 8 MB octal PSRAM).
; Same platform version as upstream (espressif32 ~6.13.0). The board definition already sets
; BOARD_HAS_PSRAM, ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1, qio_opi memory and default_8MB.csv.
[env:xiao_esp32s3]
platform = espressif32@~6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; Bench build: USB_SENSE is ignored and the ADS1299 runs on USB power. Only for a bench board with Q1 removed, inputs
; shorted or on a signal generator. Never on a person. It says so at boot and in the BLE status string.
[env:xiao_esp32s3_bench]
extends = env:xiao_esp32s3
build_flags = -D BENCH_NO_INTERLOCK
