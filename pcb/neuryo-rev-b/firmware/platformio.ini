; Neuryo rev B: Seeed XIAO ESP32-S3 (8 MB flash, 8 MB octal PSRAM).
; Same platform version as upstream (espressif32 ~6.13.0). The board definition already sets
; BOARD_HAS_PSRAM, ARDUINO_USB_MODE=1, ARDUINO_USB_CDC_ON_BOOT=1, qio_opi memory and default_8MB.csv.
[env:xiao_esp32s3]
platform = espressif32@~6.13.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
